<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#101F42"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Tower Structure Gradient -->
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Energy Lightning Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Enel Accent Gradient -->
    <linearGradient id="enelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#74C82C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#enelBorder)" stroke-width="5" opacity="0.6"/>

  <!-- Substation High-Voltage Busbars (Horizontal lines) -->
  <path d="M 50 150 H 462 M 50 220 H 462 M 50 290 H 462" stroke="#1E293B" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- Tower Apex / Pinnacle -->
  <polygon points="256,65 234,120 278,120" fill="none" stroke="url(#towerGrad)" stroke-width="10" stroke-linejoin="round"/>
  <line x1="256" y1="40" x2="256" y2="65" stroke="url(#towerGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Main Tower Legs -->
  <path d="M 180 430 L 226 120 L 286 120 L 332 430" fill="none" stroke="url(#towerGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Crossarm 1 (Top) -->
  <line x1="140" y1="165" x2="372" y2="165" stroke="url(#towerGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Crossarm 2 (Middle - Widest) -->
  <line x1="105" y1="235" x2="407" y2="235" stroke="url(#towerGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Crossarm 3 (Lower) -->
  <line x1="150" y1="305" x2="362" y2="305" stroke="url(#towerGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Tower Internal X-Bracing (Lattice Structure) -->
  <line x1="222" y1="165" x2="280" y2="235" stroke="url(#towerGrad)" stroke-width="7" opacity="0.9"/>
  <line x1="290" y1="165" x2="232" y2="235" stroke="url(#towerGrad)" stroke-width="7" opacity="0.9"/>
  <line x1="210" y1="235" x2="290" y2="305" stroke="url(#towerGrad)" stroke-width="7" opacity="0.9"/>
  <line x1="302" y1="235" x2="222" y2="305" stroke="url(#towerGrad)" stroke-width="7" opacity="0.9"/>
  <line x1="195" y1="305" x2="305" y2="430" stroke="url(#towerGrad)" stroke-width="8" opacity="0.85"/>
  <line x1="317" y1="305" x2="207" y2="430" stroke="url(#towerGrad)" stroke-width="8" opacity="0.85"/>

  <!-- Horizontal braces -->
  <line x1="195" y1="305" x2="317" y2="305" stroke="url(#towerGrad)" stroke-width="8"/>
  <line x1="180" y1="430" x2="332" y2="430" stroke="url(#towerGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Insulator Strings (Cadenas de aisladores) -->
  <line x1="150" y1="165" x2="150" y2="195" stroke="#94A3B8" stroke-width="8" stroke-dasharray="2,5" stroke-linecap="round"/>
  <circle cx="150" cy="202" r="6" fill="#38BDF8"/>
  <line x1="362" y1="165" x2="362" y2="195" stroke="#94A3B8" stroke-width="8" stroke-dasharray="2,5" stroke-linecap="round"/>
  <circle cx="362" cy="202" r="6" fill="#38BDF8"/>

  <line x1="115" y1="235" x2="115" y2="265" stroke="#94A3B8" stroke-width="8" stroke-dasharray="2,5" stroke-linecap="round"/>
  <circle cx="115" cy="272" r="6" fill="#38BDF8"/>
  <line x1="397" y1="235" x2="397" y2="265" stroke="#94A3B8" stroke-width="8" stroke-dasharray="2,5" stroke-linecap="round"/>
  <circle cx="397" cy="272" r="6" fill="#38BDF8"/>

  <!-- High-Energy Central Power Spark / Rayo de Potencia Eléctrica -->
  <path d="M 270 185 L 232 260 L 265 260 L 240 345 L 292 250 L 258 250 Z" fill="url(#energyGrad)" filter="url(#glow)"/>
  <path d="M 270 185 L 232 260 L 265 260 L 240 345 L 292 250 L 258 250 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Substation Badge Pill at Bottom -->
  <rect x="176" y="445" width="160" height="36" rx="10" fill="#0F172A" stroke="url(#enelBorder)" stroke-width="2.5"/>
  <text x="256" y="470" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="4">SSEE</text>
</svg>
